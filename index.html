<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swastha Home Made Food — Website Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,700&family=DM+Sans:wght@400;500;700&family=Kaushan+Script&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#FBF6EA; --cream-2:#F2EAD3; --cream-3:#E4D8B8;
  --choco:#1E3D2A; --choco-2:#3F5A45; --muted:#7A7A62;
  --accent:#8B2323; --accent-2:#6B1F1F;
  --pink:#F4A6B4; --gold:#D9A441; --sage:#6E9B3F;
  --radius:22px; --shadow:0 18px 40px -18px rgba(30,61,42,.35);
  --display:'Fraunces', Georgia, serif; --body:'DM Sans', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--choco);font-family:var(--body);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{width:min(1180px,92vw);margin:0 auto}
.loading{height:100vh;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:var(--choco-2)}

/* progress */
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--accent);transform-origin:0 50%;z-index:100}

/* nav */
.nav{position:fixed;top:14px;left:0;right:0;margin:0 auto;width:min(1180px,94vw);z-index:50;
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 22px;border-radius:999px;
  transition:background .3s, box-shadow .3s}
.nav.scrolled{background:rgba(255,246,236,.85);backdrop-filter:blur(14px);box-shadow:0 10px 30px -15px rgba(30,61,42,.3)}
.logo{font-family:var(--display);font-weight:800;font-size:1.45rem;display:flex;align-items:center;gap:8px}
.logo i{font-style:italic;color:var(--accent);font-weight:500}
.links{display:flex;gap:4px}
.links a{position:relative;padding:8px 16px;border-radius:999px;font-weight:500;font-size:.95rem}
.links a .hover-pill{position:absolute;inset:0;background:var(--cream-3);border-radius:999px;z-index:-1}
.nav-right{display:flex;align-items:center;gap:10px}
.cart{position:relative;width:46px;height:46px;border-radius:50%;background:var(--cream-2);display:grid;place-items:center}
.cart .count{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:.98rem}
.btn-dark{background:var(--choco);color:var(--cream)}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{border:2px solid var(--choco);}
.burger{display:none;width:46px;height:46px;border-radius:50%;background:var(--choco);color:var(--cream);place-items:center}
.mobile-menu{position:fixed;top:84px;left:3vw;right:3vw;background:var(--choco);color:var(--cream);border-radius:26px;padding:22px;z-index:49;display:flex;flex-direction:column;gap:6px}
.mobile-menu a{font-family:var(--display);font-size:1.6rem;padding:6px 8px}

/* hero */
.hero{min-height:100vh;padding:130px 0 60px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;background:#fff;padding:8px 16px;border-radius:999px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:#3BB273;box-shadow:0 0 0 0 rgba(59,178,115,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(59,178,115,0)}100%{box-shadow:0 0 0 0 rgba(59,178,115,0)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,7.2vw,6.3rem);line-height:.98;letter-spacing:-.03em;margin:22px 0}
h1 .line{display:block}
h1 .word{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
h1 .word span{display:inline-block}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{font-size:1.15rem;color:var(--choco-2);max-width:470px}
.hero-ctas{display:flex;gap:14px;margin:34px 0 44px;flex-wrap:wrap}
.stats{display:flex;gap:38px}
.stat b{font-family:var(--display);font-size:2.1rem;display:block;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}
.hero-art{position:relative;aspect-ratio:1/1;width:100%;max-width:560px;justify-self:center}
.blob{position:absolute;inset:6%;background:radial-gradient(circle at 35% 30%,#F3D58E,var(--gold) 60%,#B9832A);border-radius:46% 54% 52% 48%/48% 44% 56% 52%}
.hero-cake{position:absolute;inset:12% 12% 8%}
.floater{position:absolute;width:26%;filter:drop-shadow(0 18px 18px rgba(30,61,42,.28))}
.badge{position:absolute;width:128px;height:128px;left:-2%;bottom:6%;background:var(--choco);color:var(--cream);border-radius:50%;display:grid;place-items:center}
.badge svg{position:absolute;inset:0}
.badge .center{font-size:1.9rem}
.hero-tag{position:absolute;right:0;top:12%;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-size:.85rem;display:flex;gap:10px;align-items:center}
.hero-tag b{display:block;font-size:.95rem}

/* marquee */
.marquee{background:var(--choco);color:var(--cream);padding:22px 0;overflow:hidden;transform:rotate(-1.5deg);margin:20px -10px}
.marquee-track{display:flex;gap:48px;width:max-content;font-family:var(--display);font-size:2rem;font-style:italic;white-space:nowrap}
.marquee-track span{display:flex;align-items:center;gap:48px}
.marquee-track .star{color:var(--gold);font-style:normal}

/* sections */
section{padding:110px 0}
.eyebrow{display:inline-block;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-bottom:14px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,3.8rem);line-height:1.02;letter-spacing:-.02em}
h2 em{font-style:italic;font-weight:500;color:var(--accent)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:46px;flex-wrap:wrap}

/* menu */
.tabs{display:flex;gap:6px;background:var(--cream-2);padding:6px;border-radius:999px;flex-wrap:wrap}
.tab{position:relative;padding:10px 20px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:0}
.tab .active-pill{position:absolute;inset:0;background:var(--choco);border-radius:999px;z-index:-1}
.tab.on{color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 2px 0 rgba(30,61,42,.04)}
.card-art{border-radius:16px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden}
.card-art svg{width:72%}
.tag{position:absolute;top:12px;left:12px;background:#fff;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px}
.card h3{font-family:var(--display);font-size:1.22rem;margin:14px 4px 2px;line-height:1.2}
.card p{font-size:.86rem;color:var(--muted);margin:0 4px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 4px}
.price{font-family:var(--display);font-weight:800;font-size:1.3rem}
.add{width:44px;height:44px;border-radius:50%;background:var(--choco);color:var(--cream);display:grid;place-items:center;font-size:1.4rem}

/* features */
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
.feat{background:var(--cream-2);border-radius:var(--radius);padding:28px}
.feat .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;margin-bottom:18px;background:#fff}
.feat h4{font-family:var(--display);font-size:1.25rem;margin-bottom:6px}
.feat p{font-size:.92rem;color:var(--choco-2)}

/* builder */
.builder{background:var(--choco);color:var(--cream);border-radius:40px;padding:70px 60px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;position:relative;overflow:hidden}
.builder h2 em{color:var(--gold)}
.builder .eyebrow{color:var(--gold)}
.builder-stage{background:radial-gradient(circle at 50% 60%,#2E5A3E,#1E3D2A 70%);border-radius:30px;aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.opt-group{margin-top:26px}
.opt-group label{display:block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#c9d6c0;margin-bottom:10px;font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative;padding:10px 18px;border-radius:999px;border:1.5px solid rgba(255,246,236,.25);font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center;z-index:0}
.opt .sel{position:absolute;inset:-1.5px;border-radius:999px;background:var(--cream);z-index:-1}
.opt.on{color:var(--choco);border-color:transparent}
.swatch{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.builder-foot{display:flex;align-items:center;gap:22px;margin-top:34px;flex-wrap:wrap}
.total{font-family:var(--display);font-size:2.4rem;font-weight:800}
.total small{display:block;font-family:var(--body);font-size:.8rem;font-weight:500;color:#c9d6c0}

/* story */
.story{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.story-art{position:relative;border-radius:36px;aspect-ratio:4/5;background:var(--sage);overflow:hidden;display:grid;place-items:center}
.story-art svg{width:78%}
.story-note{position:absolute;bottom:22px;left:22px;right:22px;background:var(--cream);border-radius:20px;padding:16px 18px;font-family:var(--display);font-style:italic;font-size:1.05rem}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.counter{border-top:2px solid var(--choco);padding-top:14px}
.counter b{font-family:var(--display);font-size:2.6rem;line-height:1}
.counter span{display:block;font-size:.86rem;color:var(--muted)}

/* testimonials */
.testi{background:var(--cream-2);border-radius:40px;padding:70px 60px;text-align:center;position:relative;overflow:hidden}
.quote-wrap{min-height:230px;display:grid;place-items:center;margin-top:24px;cursor:grab}
.quote{font-family:var(--display);font-size:clamp(1.4rem,2.6vw,2.1rem);line-height:1.3;max-width:820px;margin:0 auto}
.who{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.stars{color:var(--gold);letter-spacing:3px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:26px}
.dots button{height:10px;border-radius:5px;background:var(--choco)}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1.1fr;gap:30px}
.visit-card{background:#fff;border-radius:var(--radius);padding:38px}
.hours{list-style:none;margin-top:22px}
.hours li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--cream-3)}
.hours li.today{color:var(--accent);font-weight:700}
.map{border-radius:var(--radius);overflow:hidden;position:relative;min-height:380px;background:#EADBC6}
.pin{position:absolute;left:52%;top:44%;transform:translate(-50%,-100%)}

/* footer */
footer{background:var(--choco);color:var(--cream);padding:80px 0 30px;margin-top:60px;overflow:hidden}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
.foot-grid h5{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.foot-grid a{display:block;padding:4px 0;color:#d6e2cf}
.big-name em{color:var(--gold)!important}
.big-name{font-family:var(--display);font-weight:800;font-size:clamp(4rem,17vw,15rem);line-height:.85;letter-spacing:-.04em;margin-top:60px;white-space:nowrap;color:#2B5238}
.big-name em{color:var(--accent);font-weight:500}
.copy{display:flex;justify-content:space-between;font-size:.82rem;color:#9fb39a;margin-top:20px;flex-wrap:wrap;gap:10px}

/* nav active + pages */
.links a.active{color:var(--accent)}
.links a.active::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.curtain{position:fixed;inset:0;background:var(--choco);z-index:90;transform-origin:50% 0;display:grid;place-items:center;pointer-events:none}
.curtain span{font-family:var(--display);font-style:italic;color:var(--cream);font-size:clamp(2.4rem,6vw,4.5rem)}
.page-hero{padding:160px 0 50px;position:relative;overflow:hidden}
.page-hero h1{font-size:clamp(2.8rem,6.4vw,5.4rem);margin:10px 0 18px}
.crumbs{font-size:.85rem;color:var(--muted);font-weight:500}
.crumbs a{color:var(--accent)}
.page-hero .deco{position:absolute;right:4%;top:120px;width:min(300px,30vw);opacity:.95}

/* bestsellers + gallery preview */
.link-arrow{font-weight:700;color:var(--accent);display:inline-flex;gap:8px;align-items:center}

/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:210px;grid-auto-flow:dense;gap:18px}
.g-item{border-radius:24px;overflow:hidden;position:relative;cursor:zoom-in;display:grid;place-items:center}
.g-item.tall{grid-row:span 2}
.g-item .g-art{width:62%;max-width:260px;display:grid}
.g-item.tall .g-art{width:74%}
.g-cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,246,236,.92);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-cap b{font-family:var(--display);font-size:1.02rem;line-height:1.2}
.g-cap small{display:block;color:var(--muted);font-size:.75rem}
.g-cap .zoom{width:34px;height:34px;flex:none;border-radius:50%;background:var(--choco);color:var(--cream);display:grid;place-items:center}
.backdrop{position:fixed;inset:0;background:rgba(18,36,24,.6);backdrop-filter:blur(6px);z-index:80}
.lightbox{position:fixed;inset:0;z-index:81;display:grid;place-items:center;padding:20px;pointer-events:none}
.lb-card{pointer-events:auto;background:var(--cream);border-radius:30px;width:min(900px,100%);display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;max-height:92vh}
.lb-art{display:grid;place-items:center;padding:40px;min-height:340px}
.lb-art > div{width:80%;display:grid}
.lb-info{padding:40px 34px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.lb-info h3{font-family:var(--display);font-size:2rem;line-height:1.1}
.close{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.1rem;box-shadow:var(--shadow)}

/* cart drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--cream);z-index:82;display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.35)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:24px 24px 16px;border-bottom:1px solid var(--cream-3)}
.drawer-head h3{font-family:var(--display);font-size:1.6rem}
.drawer-body{flex:1;overflow:auto;padding:12px 24px}
.cline{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--cream-3)}
.cline .thumb{width:64px;height:64px;border-radius:14px;display:grid;place-items:center}
.cline .thumb > *{width:70%}
.cline b{font-family:var(--display);font-size:1rem;display:block;line-height:1.2}
.qty{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--cream-2);font-weight:700}
.drawer-foot{padding:20px 24px 26px;border-top:1px solid var(--cream-3);display:flex;flex-direction:column;gap:12px}
.drawer-foot .row{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
.empty{text-align:center;padding:60px 10px;color:var(--muted)}
.btn-wa{background:#25D366;color:#fff;justify-content:center}

/* about timeline */
.timeline{position:relative;max-width:760px;margin:0 auto;padding-left:40px}
.timeline .rail{position:absolute;left:11px;top:0;bottom:0;width:3px;background:var(--cream-3);border-radius:3px}
.timeline .rail-fill{position:absolute;inset:0;background:var(--accent);transform-origin:50% 0;border-radius:3px}
.tl-item{position:relative;padding:0 0 46px 20px}
.tl-item::before{content:"";position:absolute;left:-36px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--cream);border:3px solid var(--accent)}
.tl-item .yr{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--accent);line-height:1}
.tl-item h4{font-family:var(--display);font-size:1.35rem;margin:6px 0 4px}
.tl-item p{color:var(--choco-2)}

/* cta band */
.cta-band{background:var(--accent);color:#fff;border-radius:36px;padding:56px;display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta-band h2{color:#fff;max-width:620px}
.cta-band h2 em{color:var(--gold)}
.cta-band .btn{background:#fff;color:var(--choco)}

/* contact */
.c-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:30px}
.c-card{background:#fff;border-radius:var(--radius);padding:24px}
.c-card .ico{width:50px;height:50px;border-radius:14px;background:var(--cream-2);display:grid;place-items:center;font-size:1.4rem;margin-bottom:14px}
.c-card h4{font-family:var(--display);font-size:1.15rem}
.c-card p,.c-card a{color:var(--choco-2);font-size:.93rem;display:block;word-break:break-word}
.contact-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:start}
.form{background:#fff;border-radius:28px;padding:38px}
.form h3{font-family:var(--display);font-size:1.8rem;margin-bottom:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;padding:13px 16px;border-radius:14px;border:1.5px solid var(--cream-3);background:var(--cream);color:var(--choco);outline:none;transition:border-color .2s, box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,35,35,.15)}
.field textarea{min-height:110px;resize:vertical}
.err{color:#C0392B;font-size:.78rem}
.sent{text-align:center;padding:30px 10px}
.sent .tick{width:80px;height:80px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:2.4rem;margin:0 auto 18px}
.map-note{font-size:.78rem;color:var(--muted);margin-top:10px}

/* floating */
.wa{position:fixed;right:22px;bottom:22px;width:62px;height:62px;border-radius:50%;background:#25D366;display:grid;place-items:center;z-index:60;box-shadow:0 12px 30px -8px rgba(37,211,102,.7)}
.toast{position:fixed;left:50%;bottom:28px;background:var(--choco);color:var(--cream);padding:14px 22px;border-radius:999px;z-index:70;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}

@media (max-width:980px){
  .links,.nav .btn{display:none}
  .burger{display:grid}
  .hero-grid,.builder,.story,.visit{grid-template-columns:1fr}
  .grid,.features{grid-template-columns:repeat(2,1fr)}
  .foot-grid{grid-template-columns:1fr 1fr}
  .builder,.testi{padding:44px 24px;border-radius:30px}
  .hero{padding-top:110px}
  .ggrid{grid-template-columns:repeat(2,1fr);grid-auto-rows:190px}
  .lb-card{grid-template-columns:1fr}
  .lb-art{min-height:240px;padding:24px}
  .c-cards{grid-template-columns:repeat(2,1fr)}
  .contact-grid{grid-template-columns:1fr}
  .page-hero .deco{opacity:.25;right:-6%}
  .cta-band{padding:40px 28px}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .features{grid-template-columns:1fr}
  .stats{gap:22px}
  .card{padding:10px}
  .card h3{font-size:1.02rem}
  .counters{grid-template-columns:1fr 1fr 1fr}

function Floater({ mx, my, depth, style, children, float=12, dur=4 }) {

}

function CartDrawer({ open, close, cart, setQty }) {
  const lines = PRODUCTS.filter(p=>cart[p.id]).map(p=>({...p, qty:cart[p.id]}));
  const total = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const msg = `Hi ${BIZ.short}! I'd like to order:\n` + lines.map(l=>`• ${l.qty} × ${l.name} (${l.unit}) — ${inr(l.price*l.qty)}`).join("\n") + `\n\nTotal: ${inr(total)}\nName: \nDelivery address: `;
  return (
    <AnimatePresence>
      {open && (<>
        <motion.div className="backdrop" onClick={close} initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}/>
        <motion.aside className="drawer" initial={{x:"100%"}} animate={{x:0}} exit={{x:"100%"}} transition={{type:"spring",stiffness:300,damping:34}}>

                  <div><b>{l.name}</b><span style={{fontSize:".85rem",color:"var(--muted)"}}>{inr(l.price)} · {l.unit}</span></div>
                  <div className="qty">
                    <button onClick={()=>setQty(l.id,l.qty-1)} aria-label="Decrease">−</button>
                    <motion.span key={l.qty} initial={{scale:1.4}} animate={{scale:1}} style={{minWidth:18,textAlign:"center",fontWeight:700}}>{l.qty}</motion.span>
                    <button onClick={()=>setQty(l.id,l.qty+1)} aria-label="Increase">+</button>

                </motion.div>

          </div>
          {lines.length>0 && (
            <div className="drawer-foot">
              <div className="row"><span>Total</span><span>{inr(total)}</span></div>
              <p style={{fontSize:".8rem",color:"var(--muted)"}}>Your order opens in WhatsApp with everything filled in. We'll confirm availability and delivery there.</p>

}

          <Tabs items={CATS} value={cat} onChange={setCat} id="m"/>
          <span style={{fontSize:".85rem",color:"var(--muted)"}}>{list.length} items · prices incl. taxes</span>
        </Reveal>
        <motion.div className="grid" layout>
          <AnimatePresence mode="popLayout">
            {list.map((p,i)=><ProductCard key={p.id} p={p} i={i} onAdd={onAdd}/>)}
          </AnimatePresence>
        </motion.div>
      </div>
    </section>
    <CtaBand title={<>Need a <em>bulk order?</em></>} text="Festivals, functions and corporate gifting: tell us the quantity and date and we'll take care of it." cta="Get a quote" msg="Hi Swastha! I'd like a quote for a bulk order. Items: , Quantity: , Date: "/>
  </>);
}

/* ═════════ CONTACT ═════════ */
function ContactPage() {
  const [f,setF]=useState({name:"",phone:"",type:"Regular order",date:"",message:""});
  const [errors,setErrors]=useState({}), [sent,setSent]=useState(false);
  const set = k => e => setF({...f,[k]:e.target.value});
  const msg = `Hi ${BIZ.short}! New enquiry:\n• Name: ${f.name}\n• Phone: ${f.phone}\n• Enquiry: ${f.type}${f.date?`\n• Date needed: ${f.date}`:""}\n• Message: ${f.message}`;
  const submit = e => {
    e.preventDefault();
    const er={};
    if(!f.name.trim()) er.name="Please enter your name";
    if(!/^[0-9+\s-]{10,15}$/.test(f.phone.trim())) er.phone="Enter a valid phone number";
    if(!f.message.trim()) er.message="Tell us what you'd like to order";
    setErrors(er);
    if(!Object.keys(er).length) setSent(true);
  };
  const cards=[["📞","Call us",BIZ.phoneDisplay],["💬","WhatsApp","Chat to order",waLink("Hi Swastha!")],["📸","Instagram",BIZ.instagram,BIZ.instagramUrl],["📍","Location",BIZ.city]];
  return (<>
    <PageHero crumb="Contact" eyebrow="Get in touch" lines={[["Let's","get"],["you",<em key="s">snacking.</em>]]} sub="Orders, bulk enquiries or questions. Send us a message and we'll reply on WhatsApp." img="karjikai.jpg"/>
    <section style={{paddingTop:20}}>
      <div className="wrap">
        <motion.div className="c-cards" initial="hidden" whileInView="show" viewport={{once:true}} variants={{show:{transition:{staggerChildren:.1}}}}>
          {cards.map(([i,t,v,href])=>(
            <motion.div className="c-card" key={t} variants={fadeUp} whileHover={{y:-6}}>
              <div className="ico">{i}</div><h4>{t}</h4>
              {href ? <a href={href} target="_blank" rel="noopener" style={{color:"var(--accent)",fontWeight:700}}>{v} →</a> : <p>{v}</p>}
            </motion.div>
          ))}
        </motion.div>
        <div className="contact-grid">
          <Reveal className="form">
            <AnimatePresence mode="wait">
              {!sent ? (
                <motion.form key="f" onSubmit={submit} noValidate exit={{opacity:0,scale:.95}}>
                  <h3>Send an enquiry</h3>
                  <p style={{color:"var(--muted)",fontSize:".92rem"}}>Fill this in and we'll open WhatsApp with your message ready to send.</p>
                  <div className="fields">
                    <div className="field"><label>Your name</label><input value={f.name} onChange={set("name")} placeholder="Your name"/>{errors.name&&<motion.span className="err" initial={{opacity:0,y:-4}} animate={{opacity:1,y:0}}>{errors.name}</motion.span>}</div>
                    <div className="field"><label>Phone</label><input value={f.phone} onChange={set("phone")} placeholder="98765 43210" inputMode="tel"/>{errors.phone&&<motion.span className="err" initial={{opacity:0,y:-4}} animate={{opacity:1,y:0}}>{errors.phone}</motion.span>}</div>
                    <div className="field"><label>Enquiry type</label><select value={f.type} onChange={set("type")}>{["Regular order","Festival / bulk order","Gift snack box","Delivery question","Other"].map(o=><option key={o}>{o}</option>)}</select></div>
                    <div className="field"><label>Date needed</label><input type="date" value={f.date} onChange={set("date")}/></div>
                    <div className="field full"><label>Message</label><textarea value={f.message} onChange={set("message")} placeholder="e.g. 1 kg chakli, 2 jars puliyogare gojju, 20 holige for a function"/>{errors.message&&<motion.span className="err" initial={{opacity:0,y:-4}} animate={{opacity:1,y:0}}>{errors.message}</motion.span>}</div>
                  </div>
                  <motion.button type="submit" className="btn btn-accent" style={{marginTop:22}} whileHover={{scale:1.04}} whileTap={{scale:.96}}>Continue to WhatsApp →</motion.button>
                </motion.form>
              ) : (
                <motion.div key="s" className="sent" initial={{opacity:0,scale:.9}} animate={{opacity:1,scale:1}}>
                  <motion.div className="tick" initial={{scale:0,rotate:-90}} animate={{scale:1,rotate:0}} transition={{type:"spring",stiffness:200,damping:12,delay:.1}}>✓</motion.div>
                  <h3 style={{fontFamily:"var(--display)",fontSize:"1.8rem"}}>Almost done, {f.name.split(" ")[0]}!</h3>
                  <p style={{color:"var(--choco-2)",margin:"8px auto 22px",maxWidth:360}}>Your enquiry is ready. Tap below to send it to us on WhatsApp.</p>
                  <motion.a className="btn btn-wa" href={waLink(msg)} target="_blank" rel="noopener" whileHover={{scale:1.04}} whileTap={{scale:.96}}>💬 Send on WhatsApp</motion.a>
                  <div><button onClick={()=>setSent(false)} style={{marginTop:16,color:"var(--muted)",textDecoration:"underline",fontSize:".88rem"}}>Edit enquiry</button></div>
                </motion.div>
              )}
            </AnimatePresence>
          </Reveal>
          <div style={{display:"flex",flexDirection:"column",gap:24}}>
            <Reveal delay={.1} style={{height:320,position:"relative"}}><MapBox/></Reveal>
            <Reveal delay={.15} className="visit-card" style={{padding:30}}>
              <h3 style={{fontFamily:"var(--display)",fontSize:"1.4rem"}}>How ordering works</h3>
              <ol className="steps">
                <li><div><b>Pick your items</b><span>Add them to your basket from the menu.</span></div></li>
                <li><div><b>Send on WhatsApp</b><span>Your order is filled in for you. Just tap send.</span></div></li>
                <li><div><b>We confirm</b><span>We'll confirm availability, total and delivery.</span></div></li>
                <li><div><b>Enjoy!</b><span>Freshly made and packed, delivered to you.</span></div></li>
              </ol>
            </Reveal>
          </div>
        </div>
      </div>
    </section>
  </>);
}

/* ═════════ APP + ROUTER ═════════ */
const ROUTES = ["home","about","gallery","menu","contact"];
const getRoute = () => { const h=location.hash.slice(1); return ROUTES.includes(h)?h:"home"; };

function App() {
  const [route,setRoute]=useState(getRoute);
  useEffect(()=>{ const f=()=>{ const r=location.hash.slice(1); if(ROUTES.includes(r)||r==="") setRoute(getRoute()); }; window.addEventListener("hashchange",f); return ()=>window.removeEventListener("hashchange",f); },[]);
  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress,{stiffness:120,damping:25});
  const [cart,setCart]=useState({}), [toast,setToast]=useState(null), [cartOpen,setCartOpen]=useState(false);
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const onAdd = p => { setCart(c=>({...c,[p.id]:(c[p.id]||0)+1})); setToast({t:p.name+" added", k:Date.now()}); };
  const setQty = (id,q) => setCart(c=>{ const n={...c}; if(q<=0) delete n[id]; else n[id]=q; return n; });
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),2200); return ()=>clearTimeout(t); },[toast]);
  const label = NAV.find(n=>n[1]===route)[0];
  const Page = { home:<HomePage onAdd={onAdd}/>, about:<AboutPage/>, gallery:<GalleryPage/>, menu:<MenuPage onAdd={onAdd}/>, contact:<ContactPage/> }[route];
  return (<>
    <motion.div className="progress" style={{scaleX}}/>
    <Nav route={route} count={count} openCart={()=>setCartOpen(true)}/>
    <AnimatePresence mode="wait" onExitComplete={()=>window.scrollTo(0,0)}>
      <motion.main key={route} initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0,y:-30}} transition={{duration:.35}}>
        {Page}
      </motion.main>
    </AnimatePresence>
    <AnimatePresence>
      <motion.div key={"c-"+route} className="curtain" initial={{y:"100%"}} animate={{y:["100%","0%","0%","-100%"]}} transition={{duration:1.25,times:[0,.32,.55,1],ease:[.76,0,.24,1]}}>
        <motion.span initial={{opacity:0,y:30}} animate={{opacity:[0,1,1,0],y:[30,0,0,-30]}} transition={{duration:1.1,times:[.2,.35,.5,.65]}}>{label}</motion.span>
      </motion.div>
    </AnimatePresence>
    <Footer/>
    <CartDrawer open={cartOpen} close={()=>setCartOpen(false)} cart={cart} setQty={setQty}/>
    <motion.a className="wa" href={waLink("Hi Swastha! I'd like to place an order.")} target="_blank" rel="noopener" aria-label="WhatsApp"
      initial={{scale:0}} animate={{scale:1}} transition={{delay:2,type:"spring"}} whileHover={{scale:1.12,rotate:-8}} whileTap={{scale:.9}}>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .3-3.4-.7-2.9-1.2-4.7-4.1-4.8-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    </motion.a>
    <AnimatePresence>
      {toast && <motion.button key={toast.k} onClick={()=>setCartOpen(true)} className="toast" initial={{y:80,x:"-50%",opacity:0}} animate={{y:0,x:"-50%",opacity:1}} exit={{y:80,x:"-50%",opacity:0}} transition={{type:"spring",stiffness:300,damping:24}}>✅ {toast.t} · <u>View basket</u></motion.button>}
    </AnimatePresence>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
